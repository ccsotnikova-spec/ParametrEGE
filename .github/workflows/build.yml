name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Download Linux Wrapper and Build
      run: |
        wget https://raw.githubusercontent.com/minecraftforge/MinecraftForge/1.20.x/gradlew
        chmod +x gradlew
        ./gradlew build --no-daemon
      
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ParametrEGE-Mod
        path: build/libs/*.jar
