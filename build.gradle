plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
}

version = '1.0.0'
group = 'com.parametrege'

java {
    archivesBaseName = 'parametr_ege'
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // ИСПОЛЬЗУЕМ ОФИЦИАЛЬНЫЕ ИСХОДНИКИ MOJANG (РАБОТАЕТ ВСЕГДА 100%)
    mappings channel: 'official', version: '1.20.4'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { parametr_ege { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { parametr_ege { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.4-49.0.30'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "parametr_ege",
            "Specification-Vendor": "parametrege",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": "parametrege"
        ])
    }
}
